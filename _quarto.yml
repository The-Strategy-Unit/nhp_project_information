project:
  type: website

website:
  site-url: "https://connect.strategyunitwm.nhs.uk/nhp/project_information"
  open-graph: true
  repo-url: https://github.com/The-Strategy-Unit/nhp_project_information
  repo-actions: [edit, issue]
  title: "OpenPlan hospital demand model"
  description: "Documentation for the OpenPlan hospital demand model created by the Strategy Unit to support NHS England's New Hospital Programme"
  favicon: _assets/favicon.ico
  navbar:
    background: dark
    foreground: light
    title: "OpenPlan hospital demand model <span style='background:white; color:black; padding:3px 9px; border-radius:20px; font-size:0.65em; font-weight:600; margin-left:6px;'>DOCS</span>"
    pinned: true
  sidebar:
    style: "floating"
    search: true
    collapse-level: 1
    contents:

      - section: "News"
        href: news/news.qmd
        contents:
          - news/model_updates.qmd
          - news/roadmap.qmd
      - quick_start/quick_start.qmd
      - overview/model_summary.qmd
      - section: "Key concept: TPMAs"
        href: overview/TPMAs.qmd
        contents:
            - overview/tpmas_lookup.qmd
            - overview/inpatient_tpmas.qmd
            - overview/outpatient_tpmas.qmd
            - overview/ae_tpmas.qmd
      - overview/limitations.qmd
      - section: "Assurance"
        href: assurance/assurance.qmd
        contents:
          - assurance/assumptions-log.qmd
          - assurance/data_log.qmd
      - section: "Technical information"
        href: technical/technical.qmd
        contents:
          - section: "Data pre-processing"
            contents:
              - auto: technical/data_extraction/*.qmd
          - section: "Modelling methodology"
            contents:
              - auto: technical/modelling_methodology/*.qmd
          - section: "Demographic modelling"
            href: technical/modelling_methodology/demographic_modelling/demographic_modelling.qmd
            contents:
              - technical/modelling_methodology/demographic_modelling/modelling_utilisation_rates.qmd
              - technical/modelling_methodology/demographic_modelling/list_of_projections.qmd
          - technical/developer/code.qmd
      - contact.qmd
  page-navigation: true
  page-footer:
    right: "[OpenPlan hospital demand model documentation](https://connect.strategyunitwm.nhs.uk/nhp/project_information/)© 2023 by [The Strategy Unit](https://www.strategyunitwm.nhs.uk/) is licensed under [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/)"

format:
  html:
    toc: true
    toc-depth: 4
    theme:
      light: [cosmo, _assets/style/theme.scss]
    code-copy: true
    code-overflow: wrap
    css: _assets/style/styles.css
    include-after-body: _assets/style/js.html

execute:
  freeze: false
  echo: false


callout-appearance: simple
